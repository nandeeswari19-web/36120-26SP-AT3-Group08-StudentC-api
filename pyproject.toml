[project]
name = "group08-studentc-trend-api"
version = "1.0.0"
description = "Group 08 (36120 AT3) - Student C Trend Category API: XGBoost Classifier forecasting the 7-day-ahead trend of a cryptocurrency"
authors = [{ name = "Nandeeswari Kumaravelu (25980436)" }]
readme = "README.md"
requires-python = "~=3.12.0"
dependencies = [
    "fastapi[standard]==0.139.0",
    "uvicorn==0.50.0",
    "pandas==2.2.2",
    "numpy==2.5.4",
    "scikit-learn==1.6.1",
    "xgboost==3.3.0",
    "joblib==1.5.3",
    "requests==2.34.2",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
